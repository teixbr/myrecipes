<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a tool</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #D9D2CB; font-family: 'DM Sans', system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #FAF6F2; color: #3D3632; border-radius: 28px 28px 0 0; padding-top: 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DCD3CB"></div>
    <div style="padding: 0 22px; display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 28px">Add a tool</h1>
      <a href="D_Tools.dc.html" style="height: 38px; padding: 0 16px; border-radius: 19px; background: #5E7A64; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center">Done · {{count}}</a>
    </div>
    <div style="margin: 0 22px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 1px 2px rgba(61,54,50,0.06), 0 4px 16px rgba(61,54,50,0.05)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#756C66" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="qt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search tools</label>
      <input id="qt" value="{{q}}" onChange="{{onQuery}}" placeholder="Search {{total}} tools" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: #3D3632">
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 22px 2px; flex: none">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 22px 30px; display: flex; flex-direction: column; gap: 18px">
      <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column">
          <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 700; color: #756C66; text-transform: uppercase; letter-spacing: 0.05em">{{s.name}} · {{s.n}}</h2>
          <div style="background: #FFFFFF; border-radius: 20px; padding: 0 14px">
            <sc-for list="{{s.items}}" as="it" hint-placeholder-count="6">
              <button onClick="{{it.toggle}}" aria-pressed="{{it.added}}" style="width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; border: none; border-bottom: 1px solid #F0E9E2; background: transparent; color: #3D3632; font: inherit; font-size: 15px; text-align: left; cursor: pointer">
                <span style="width: 10px; height: 10px; flex: none; border-radius: 5px; background: {{it.tint}}"></span>
                <span style="flex: 1">{{it.name}}</span>
                <sc-if value="{{it.added}}" hint-placeholder-val="{{false}}">
                  <span style="width: 28px; height: 28px; border-radius: 14px; background: #5E7A64; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
                    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
                  </span>
                </sc-if>
                <sc-if value="{{it.notAdded}}" hint-placeholder-val="{{true}}">
                  <span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #CFC5BB; color: #756C66; display: flex; align-items: center; justify-content: center">
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                  </span>
                </sc-if>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{showCustom}}" hint-placeholder-val="{{false}}">
        <button onClick="{{addCustom}}" style="height: 52px; border: 1.5px dashed #CFC5BB; border-radius: 26px; background: transparent; color: #3D3632; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Add “{{q}}” as my own tool</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const sel = {};
    ['Oven', 'Stand mixer', 'Fridge', 'Muffin tin (12-hole)', 'Medium saucepan', 'Digital scale'].forEach((n) => { sel[n] = true; });
    this.state = { q: '', cat: 'Dishes & containers', sel, custom: [] };
    this.CATS = [
      { name: 'Appliances', tint: '#F1DCD5', items: ['Oven', 'Grill', 'Hob', 'Microwave', 'Air fryer', 'Slow cooker', 'Pressure cooker', 'Multicooker', 'Rice cooker', 'Electric steamer', 'Stand mixer', 'Hand mixer', 'Blender', 'Stick blender', 'Food processor', 'Mini chopper', 'Spice grinder', 'Toaster', 'Sandwich toaster', 'Waffle maker', 'Bread maker', 'Ice cream maker', 'Deep fryer', 'Sous vide', 'Juicer', 'Dehydrator', 'Kettle', 'Coffee machine', 'Milk frother', 'Pizza oven', 'Barbecue'] },
      { name: 'Fridge & freezer', tint: '#E4E0EC', items: ['Fridge', 'Freezer', 'Ice cube tray', 'Ice lolly moulds', 'Freezer bags', 'Freezer-safe container'] },
      { name: 'Pans & pots', tint: '#F7EEDB', items: ['Small frying pan', 'Large frying pan', 'Non-stick frying pan', 'Cast-iron skillet', 'Griddle pan', 'Crêpe pan', 'Wok', 'Sauté pan', 'Small saucepan', 'Medium saucepan', 'Large saucepan', 'Milk pan', 'Stockpot', 'Casserole dish (Dutch oven)', 'Steamer basket', 'Double boiler (bain-marie)', 'Paella pan', 'Cataplana', 'Tagine', 'Fondue set'] },
      { name: 'Bakeware', tint: '#EFE6D8', items: ['Baking tray', 'Rimmed baking sheet', 'Roasting tin', 'Small loaf tin (1 lb)', 'Large loaf tin (2 lb)', 'Round cake tin 15 cm', 'Round cake tin 20 cm', 'Round cake tin 23 cm', 'Springform tin', 'Square tin', 'Traybake tin', 'Bundt tin', 'Swiss roll tin', 'Muffin tin (12-hole)', 'Mini muffin tin', 'Yorkshire pudding tin', 'Loose-bottomed tart tin', 'Mini tart tins', 'Custard tart tins', 'Pie dish', 'Madeleine tin', 'Doughnut tin', 'Silicone mould', 'Pizza stone', 'Pizza tray', 'Proving basket (banneton)', 'Cooling rack', 'Baking beans'] },
      { name: 'Dishes & containers', tint: '#DDE6DA', items: ['Shallow glass container', 'Deep glass container', 'Glass container with lid', 'Shallow glass baking dish', 'Deep glass baking dish', 'Glass mixing bowl', 'Glass jug', 'Shallow metal container', 'Deep metal container', 'Shallow metal tray', 'Deep metal tray', 'Metal mixing bowl', 'Shallow ceramic dish', 'Deep ceramic dish', 'Lasagne dish', 'Gratin dish', 'Ceramic mixing bowl', 'Ramekins', 'Pudding basin', 'Shallow plastic container', 'Deep plastic container', 'Plastic mixing bowl', 'Silicone container', 'Airtight tin', 'Kilner jar', 'Glass jar with lid', 'Serving platter', 'Cake stand'] },
      { name: 'Prep & cutting', tint: '#F1DCD5', items: ["Chef's knife", 'Paring knife', 'Bread knife', 'Carving knife', 'Cleaver', 'Kitchen scissors', 'Wooden chopping board', 'Plastic chopping board', 'Peeler', 'Box grater', 'Microplane zester', 'Mandoline', 'Spiralizer', 'Garlic press', 'Citrus juicer', 'Pestle and mortar', 'Pepper mill', 'Salad spinner', 'Colander', 'Fine sieve', 'Funnel', 'Potato masher', 'Potato ricer', 'Apple corer', 'Can opener', 'Meat mallet', 'Kitchen twine', 'Metal skewers', 'Wooden skewers'] },
      { name: 'Utensils', tint: '#DDE6DA', items: ['Wooden spoon', 'Silicone spatula', 'Fish slice', 'Slotted spoon', 'Ladle', 'Tongs', 'Balloon whisk', 'Flat whisk', 'Spider skimmer', 'Pasta server', 'Palette knife', 'Offset spatula', 'Pastry brush', 'Basting brush', 'Ice cream scoop', 'Cookie scoop', 'Oven gloves', 'Trivet', 'Splatter guard'] },
      { name: 'Measuring', tint: '#E4E0EC', items: ['Digital scale', 'Measuring jug', 'Measuring cups', 'Measuring spoons', 'Kitchen timer', 'Meat thermometer', 'Sugar thermometer', 'Oven thermometer'] },
      { name: 'Baking & decorating', tint: '#F7EEDB', items: ['Rolling pin', 'Pastry cutter', 'Dough scraper', 'Cookie cutters', 'Round biscuit cutters', 'Paper cupcake cases', 'Silicone cupcake cases', 'Foil cupcake cases', 'Tulip muffin wraps', 'Piping bags', 'Round piping nozzle', 'Star piping nozzle', 'Cake turntable', 'Cake leveller', 'Cake tester', 'Icing scraper', 'Flour shaker', 'Bread lame', 'Chocolate moulds', 'Cake pop sticks'] },
      { name: 'Wraps & lining', tint: '#EFE6D8', items: ['Baking paper', 'Silicone baking mat', 'Foil', 'Cling film', 'Beeswax wraps', 'Zip-lock bags', 'Muslin cloth'] },
      { name: 'Specialist', tint: '#E4E0EC', items: ['Pasta machine', 'Ravioli cutter', 'Gnocchi board', 'Pasta drying rack', 'Sushi mat', 'Tortilla press', 'Raclette grill', 'Blowtorch', 'Smoker'] }
    ];
  }
  renderVals() {
    const { sel, cat } = this.state;
    const q = this.state.q.trim().toLowerCase();
    const toggle = (n) => () => this.setState({ sel: { ...this.state.sel, [n]: !this.state.sel[n] } });
    const cats = this.state.custom.length ? [...this.CATS, { name: 'My tools', tint: '#C9D8C6', items: this.state.custom }] : this.CATS;
    const sections = cats
      .filter((c) => q || cat === 'All' || c.name === cat)
      .map((c) => {
        const items = c.items
          .filter((n) => !q || n.toLowerCase().indexOf(q) !== -1)
          .map((n) => ({ name: n, tint: c.tint, added: !!sel[n], notAdded: !sel[n], toggle: toggle(n) }));
        return { name: c.name, n: items.length, items };
      })
      .filter((s) => s.items.length);
    const chips = ['All', ...cats.map((c) => c.name)].map((label) => {
      const on = !q && label === cat;
      return { label, on, bg: on ? '#3D3632' : '#FFFFFF', fg: on ? '#FAF6F2' : '#3D3632', pick: () => this.setState({ cat: label, q: '' }) };
    });
    const total = this.CATS.reduce((a, c) => a + c.items.length, 0);
    const raw = this.state.q.trim();
    return {
      sections,
      chips,
      total,
      q: this.state.q,
      onQuery: (e) => this.setState({ q: e.target.value }),
      count: Object.keys(sel).filter((k) => sel[k]).length + ' added',
      showCustom: raw.length > 1 && !sections.some((s) => s.items.some((i) => i.name.toLowerCase() === raw.toLowerCase())),
      addCustom: () => this.setState({ custom: [...this.state.custom, raw], sel: { ...sel, [raw]: true }, q: '', cat: 'My tools' })
    };
  }
}
</script>
</body>
</html>
