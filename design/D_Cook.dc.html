<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cook mode, soft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: #FAF6F2; font-family: 'DM Sans', system-ui, sans-serif; padding: 60px 22px 34px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="{{backHref}}" aria-label="Close cook mode" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.raised}}; color: #FAF6F2; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 14px; font-weight: 600; color: {{t.dim}}">Mushroom risotto</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{t.dim}}">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg>Screen on</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px" role="img" aria-label="Step 3 of 6">
    <div style="height: 6px; border-radius: 3px; background: {{t.light}}"></div>
    <div style="height: 6px; border-radius: 3px; background: {{t.light}}"></div>
    <div style="height: 6px; border-radius: 3px; background: {{t.light}}"></div>
    <div style="height: 6px; border-radius: 3px; background: {{t.raised}}"></div>
    <div style="height: 6px; border-radius: 3px; background: {{t.raised}}"></div>
    <div style="height: 6px; border-radius: 3px; background: {{t.raised}}"></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.light}}">Step 3 of 6</span>
    <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 29px; font-weight: 400; line-height: 1.32">Add the rice and stir for a minute. Pour in the wine and let it bubble away, then add the stock a ladle at a time.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: {{t.dim}}; text-transform: uppercase; letter-spacing: 0.05em">You'll need</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="padding: 8px 14px; border-radius: 16px; background: {{t.raised}}; font-size: 14px">300 g arborio rice</span>
      <span style="padding: 8px 14px; border-radius: 16px; background: {{t.raised}}; font-size: 14px">125 ml white wine</span>
      <span style="padding: 8px 14px; border-radius: 16px; background: {{t.raised}}; font-size: 14px">1 l hot stock</span>
    </div>
  </div>
  <button style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 26px; border: none; background: {{t.raised}}; color: #FAF6F2; font: inherit; text-align: left">
    <span style="width: 48px; height: 48px; border-radius: 24px; background: {{t.light}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <span style="font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">18:00</span>
      <span style="font-size: 13px; color: {{t.dim}}">Start timer · simmer until creamy</span>
    </span>
  </button>
  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 60px; border-radius: 30px; border: none; background: {{t.raised}}; color: #FAF6F2; font: inherit; font-size: 16px; font-weight: 600">Back</button>
    <button style="height: 60px; border-radius: 30px; border: none; background: {{t.light}}; color: {{t.bg}}; font: inherit; font-size: 16px; font-weight: 700">Next step</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sage","blush"],"default":"sage"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.palette ?? 'sage';
    const sage = { bg: '#2E3A31', raised: '#3E4B41', light: '#B9CFB8', dim: '#C3CCC1' };
    const blush = { bg: '#3B2C30', raised: '#4D3A3F', light: '#F0C3CA', dim: '#D8C6C9' };
    return {
      t: p === 'blush' ? blush : sage,
      backHref: p === 'blush' ? 'E_Library.dc.html' : 'D_Library.dc.html'
    };
  }
}
</script>
</body>
</html>
