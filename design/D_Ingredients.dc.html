<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ingredients with scaling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F2; color: #3D3632; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="height: 150px; flex: none; background: #EFE6D8; position: relative">
    <a href="D_Library.dc.html" aria-label="Back to recipes" style="position: absolute; top: 56px; left: 18px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; color: #3D3632">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </div>
  <div style="flex: 1; margin-top: -26px; border-radius: 26px 26px 0 0; background: #FAF6F2; padding: 22px 22px 0; display: flex; flex-direction: column; gap: 14px; position: relative">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 28px; line-height: 1.1">Mushroom risotto</h1>
    <div role="tablist" aria-label="Recipe sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F0E9E2; border-radius: 22px">
      <button role="tab" aria-selected="true" style="height: 40px; border: none; border-radius: 18px; background: #FFFFFF; color: #3D3632; font: inherit; font-size: 14px; font-weight: 600">Ingredients</button>
      <button role="tab" aria-selected="false" style="height: 40px; border: none; border-radius: 18px; background: transparent; color: #756C66; font: inherit; font-size: 14px">Tools</button>
      <button role="tab" aria-selected="false" style="height: 40px; border: none; border-radius: 18px; background: transparent; color: #756C66; font: inherit; font-size: 14px">Method</button>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 6px 0 16px; border-radius: 24px; background: #FFFFFF">
        <span style="font-size: 14px"><strong style="font-weight: 700">{{servings}}</strong> servings</span>
        <span style="display: flex; gap: 4px">
          <button onClick="{{less}}" aria-label="Fewer servings" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #F0E9E2; color: #3D3632; font: inherit; font-size: 18px; cursor: pointer">−</button>
          <button onClick="{{more}}" aria-label="More servings" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #DDE6DA; color: #3D3632; font: inherit; font-size: 18px; cursor: pointer">+</button>
        </span>
      </div>
      <div role="group" aria-label="Units" style="display: flex; padding: 4px; border-radius: 24px; background: #FFFFFF">
        <button onClick="{{toMetric}}" aria-pressed="{{metric}}" style="height: 40px; padding: 0 12px; border-radius: 20px; border: none; background: {{mBg}}; color: {{mFg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">g / ml</button>
        <button onClick="{{toUS}}" aria-pressed="{{us}}" style="height: 40px; padding: 0 12px; border-radius: 20px; border: none; background: {{uBg}}; color: {{uFg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">cups / oz</button>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 16px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #F0E9E2; font-size: 15px">
          <span style="width: 78px; flex: none; font-weight: 700; color: #4A6350">{{it.qty}}</span>
          <span>{{it.name}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: #F1DCD5">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7E4538" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 8h18"></path><rect x="7" y="11" width="10" height="6.5" rx="1.5"></rect></svg>
      <span style="flex: 1; font-size: 14px; line-height: 1.4"><strong style="font-weight: 700">Oven 200°C fan</strong><br><span style="color: #5E5550">= 220°C conventional · Gas 7 · 425°F</span></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { servings: 4, metric: true };
  }
  frac(x) {
    const whole = Math.floor(x + 0.001);
    const rest = x - whole;
    const q = Math.round(rest * 4) / 4;
    const map = { 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾', 1: '' };
    const w = q === 1 ? whole + 1 : whole;
    const f = map[q] ?? '';
    return (w > 0 ? String(w) : '') + f || '¼';
  }
  fmt(amount, unit) {
    if (unit === 'count') return this.frac(amount);
    if (this.state.metric) {
      const v = amount >= 100 ? Math.round(amount / 5) * 5 : Math.round(amount);
      if (unit === 'ml' && v >= 1000) return (Math.round(v / 100) / 10) + ' l';
      return v + ' ' + unit;
    }
    if (unit === 'ml') return this.frac(amount / 240) + ' cup';
    if (unit === 'g-cup') return this.frac(amount / 200) + ' cup';
    const oz = Math.round((amount / 28.35) * 2) / 2;
    return oz + ' oz';
  }
  renderVals() {
    const k = this.state.servings / 4;
    const base = [
      [300, 'g-cup', 'Arborio rice'],
      [250, 'g', 'Chestnut mushrooms'],
      [1, 'count', 'Onion, finely chopped'],
      [2, 'count', 'Garlic cloves'],
      [1000, 'ml', 'Hot vegetable stock'],
      [125, 'ml', 'Dry white wine'],
      [50, 'g', 'Parmesan, grated']
    ];
    const items = base.map(([a, u, name]) => ({
      name,
      qty: this.fmt(a * k, u === 'g-cup' && this.state.metric ? 'g' : u)
    }));
    const m = this.state.metric;
    return {
      items,
      servings: this.state.servings,
      metric: m,
      us: !m,
      mBg: m ? '#3D3632' : 'transparent', mFg: m ? '#FAF6F2' : '#3D3632',
      uBg: m ? 'transparent' : '#3D3632', uFg: m ? '#3D3632' : '#FAF6F2',
      less: () => this.setState({ servings: Math.max(1, this.state.servings - 1) }),
      more: () => this.setState({ servings: Math.min(20, this.state.servings + 1) }),
      toMetric: () => this.setState({ metric: true }),
      toUS: () => this.setState({ metric: false })
    };
  }
}
</script>
</body>
</html>
