<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopping list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F2; color: #3D3632; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: none; padding: 64px 22px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 34px; line-height: 1.1">Shopping</h1>
      <span style="font-size: 13px; font-weight: 600; color: #4A6350; padding-bottom: 6px">{{progress}}</span>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #F0E9E2; overflow: hidden"><div style="height: 6px; width: {{pct}}; background: #5E7A64; border-radius: 3px"></div></div>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <span style="flex: none; height: 34px; padding: 0 12px; border-radius: 17px; background: #EFE6D8; font-size: 13px; font-weight: 600; display: flex; align-items: center">Mushroom risotto</span>
      <span style="flex: none; height: 34px; padding: 0 12px; border-radius: 17px; background: #F1DCD5; font-size: 13px; font-weight: 600; display: flex; align-items: center">Banana bread</span>
      <span style="flex: none; height: 34px; padding: 0 12px; border-radius: 17px; background: #DDE6DA; font-size: 13px; font-weight: 600; display: flex; align-items: center">Thai curry</span>
    </div>
    <div style="display: flex; gap: 8px">
      <label for="add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add an item</label>
      <input id="add" placeholder="Add an item…" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 16px; border: none; border-radius: 23px; background: #FFFFFF; font: inherit; font-size: 15px; color: #3D3632">
      <button aria-label="Add" style="width: 46px; height: 46px; border-radius: 23px; border: none; background: #5E7A64; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 22px 0; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{aisles}}" as="a" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; color: #756C66; text-transform: uppercase; letter-spacing: 0.05em">{{a.name}}</h2>
        <div style="background: #FFFFFF; border-radius: 20px; padding: 0 14px">
          <sc-for list="{{a.items}}" as="it" hint-placeholder-count="3">
            <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #F0E9E2; cursor: pointer">
              <input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: #5E7A64">
              <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; opacity: {{it.op}}">
                <span style="font-size: 15px; text-decoration: {{it.deco}}"><strong style="font-weight: 700">{{it.qty}}</strong> {{it.name}}</span>
                <span style="font-size: 12px; color: #756C66">{{it.from}}</span>
              </span>
            </label>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <nav aria-label="Main" style="height: 84px; flex: none; box-sizing: border-box; padding: 10px 24px 24px; background: #FFFFFF; border-radius: 24px 24px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="D_Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #756C66; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"></path></svg>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #756C66; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17l-7-4-7 4z"></path></svg>Collections</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #4A6350; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-2 9H8z"></path><path d="M6 6L5 3H2"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle></svg>Shopping</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { garlic: true } };
  }
  renderVals() {
    const d = this.state.done;
    const data = [
      { name: 'Fruit & veg', items: [
        { id: 'onion', qty: '3', name: 'onions', from: 'Risotto + Thai curry' },
        { id: 'garlic', qty: '5', name: 'garlic cloves', from: 'Risotto + Thai curry' },
        { id: 'mush', qty: '250 g', name: 'chestnut mushrooms', from: 'Risotto' },
        { id: 'banana', qty: '3', name: 'ripe bananas', from: 'Banana bread' }
      ] },
      { name: 'Dairy & eggs', items: [
        { id: 'butter', qty: '125 g', name: 'butter', from: 'Risotto + Banana bread' },
        { id: 'parm', qty: '50 g', name: 'parmesan', from: 'Risotto' },
        { id: 'egg', qty: '1', name: 'egg', from: 'Banana bread' }
      ] },
      { name: 'Cupboard', items: [
        { id: 'rice', qty: '300 g', name: 'arborio rice', from: 'Risotto' },
        { id: 'coco', qty: '400 ml', name: 'coconut milk', from: 'Thai curry' },
        { id: 'flour', qty: '225 g', name: 'self-raising flour', from: 'Banana bread' }
      ] }
    ];
    let total = 0, n = 0;
    const aisles = data.map((a) => ({
      name: a.name,
      items: a.items.map((it) => {
        total += 1;
        if (d[it.id]) n += 1;
        return { ...it, done: !!d[it.id], op: d[it.id] ? '0.45' : '1', deco: d[it.id] ? 'line-through' : 'none', toggle: () => this.setState({ done: { ...this.state.done, [it.id]: !this.state.done[it.id] } }) };
      })
    }));
    return { aisles, progress: n + ' of ' + total + ' in the basket', pct: Math.round((n / total) * 100) + '%' };
  }
}
</script>
</body>
</html>
