<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe tools</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F2; color: #3D3632; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="height: 170px; flex: none; background: #F1DCD5; position: relative; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3D3632" stroke-opacity="0.3" stroke-width="1.3" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
    <a href="D_Library.dc.html" aria-label="Back to recipes" style="position: absolute; top: 56px; left: 18px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; color: #3D3632">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </div>
  <div style="flex: 1; margin-top: -26px; border-radius: 26px 26px 0 0; background: #FAF6F2; padding: 22px 22px 0; display: flex; flex-direction: column; gap: 14px; position: relative">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 28px; line-height: 1.1">Custard tarts</h1>
    <div role="tablist" aria-label="Recipe sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F0E9E2; border-radius: 22px">
      <button role="tab" aria-selected="false" style="height: 40px; border: none; border-radius: 18px; background: transparent; color: #756C66; font: inherit; font-size: 14px">Ingredients</button>
      <button role="tab" aria-selected="true" style="height: 40px; border: none; border-radius: 18px; background: #FFFFFF; color: #3D3632; font: inherit; font-size: 14px; font-weight: 600">Tools · 6</button>
      <button role="tab" aria-selected="false" style="height: 40px; border: none; border-radius: 18px; background: transparent; color: #756C66; font: inherit; font-size: 14px">Method</button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <p style="margin: 0; font-size: 13px; color: #756C66">Get these ready before you start</p>
      <span style="font-size: 13px; font-weight: 600; color: #4A6350">{{readyText}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{tools}}" as="t" hint-placeholder-count="6">
        <label style="position: relative; min-height: 112px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #FFFFFF; border: 1.5px solid {{t.border}}; display: flex; flex-direction: column; gap: 8px; cursor: pointer">
          <input type="checkbox" checked="{{t.ready}}" onChange="{{t.toggle}}" aria-label="{{t.name}} ready" style="position: absolute; top: 14px; right: 14px; width: 20px; height: 20px; margin: 0; accent-color: #5E7A64">
          <span style="width: 42px; height: 42px; border-radius: 21px; background: {{t.tint}}; color: #3D3632; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{t.iOven}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 8h18"></path><rect x="7" y="11" width="10" height="6.5" rx="1.5"></rect><path d="M7 5.5h.01M10.5 5.5h.01"></path></svg></sc-if>
            <sc-if value="{{t.iMixer}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21h12"></path><path d="M8 21V5a2 2 0 012-2h7a2 2 0 012 2v2H11"></path><path d="M11 12h8l-1.5 5h-5z"></path><path d="M15 7v5"></path></svg></sc-if>
            <sc-if value="{{t.iFridge}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M6 9h12"></path><path d="M9.5 5v1.5M9.5 12v3"></path></svg></sc-if>
            <sc-if value="{{t.iTin}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect><circle cx="7.5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="16.5" cy="12" r="2"></circle></svg></sc-if>
            <sc-if value="{{t.iPan}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h13v6a4 4 0 01-4 4H7a4 4 0 01-4-4z"></path><path d="M16 12h5"></path><path d="M7 6.5c0-1 1-1 1-2M11 6.5c0-1 1-1 1-2"></path></svg></sc-if>
            <sc-if value="{{t.iScale}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="3.5"></rect><path d="M8 11a4 4 0 018 0"></path><path d="M12 11l1.6-2"></path></svg></sc-if>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 700">{{t.name}}</span>
            <span style="font-size: 13px; color: #756C66; line-height: 1.35">{{t.note}}</span>
          </span>
        </label>
      </sc-for>
    </div>
    <a href="D_ToolPicker.dc.html" style="height: 50px; box-sizing: border-box; text-decoration: none; border: 1.5px dashed #CFC5BB; border-radius: 25px; background: transparent; color: #3D3632; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add a tool</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ready: { oven: true, scale: true } };
  }
  renderVals() {
    const list = [
      { id: 'oven', name: 'Oven', note: '220°C fan · top shelf', icon: 'iOven', tint: '#F1DCD5' },
      { id: 'mixer', name: 'Stand mixer', note: 'Whisk attachment', icon: 'iMixer', tint: '#DDE6DA' },
      { id: 'fridge', name: 'Fridge', note: 'Chill custard overnight', icon: 'iFridge', tint: '#E4E0EC' },
      { id: 'tin', name: 'Muffin tin', note: '12-hole, lightly greased', icon: 'iTin', tint: '#EFE6D8' },
      { id: 'pan', name: 'Saucepan', note: 'Medium, heavy-based', icon: 'iPan', tint: '#F7EEDB' },
      { id: 'scale', name: 'Digital scale', note: 'For the pastry', icon: 'iScale', tint: '#DDE6DA' }
    ];
    const r = this.state.ready;
    const tools = list.map((t) => ({
      ...t,
      [t.icon]: true,
      ready: !!r[t.id],
      border: r[t.id] ? '#B9CFB8' : 'transparent',
      toggle: () => this.setState({ ready: { ...r, [t.id]: !r[t.id] } })
    }));
    const n = tools.filter((t) => t.ready).length;
    return { tools, readyText: n + ' of ' + tools.length + ' ready' };
  }
}
</script>
</body>
</html>
