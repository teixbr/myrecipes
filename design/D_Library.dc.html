<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe library, soft photo grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: #3D3632; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 64px 22px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 32px; font-weight: 500; line-height: 1.12">What are we<br>cooking tonight?</h1>
    <div style="display: flex; gap: 10px">
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; background: #FFFFFF; border-radius: 25px; box-shadow: 0 1px 2px rgba(61,54,50,0.06), 0 4px 16px rgba(61,54,50,0.05)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#756C66" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <label for="qd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search recipes</label>
        <input id="qd" placeholder="Search by name or ingredient" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: #3D3632">
      </div>
      <button aria-label="Filter" style="width: 50px; height: 50px; border-radius: 25px; border: none; background: {{t.soft}}; color: #3D3632; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      </button>
    </div>
  </div>
  <div style="padding: 20px 22px 0; flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 20px; font-weight: 500">All recipes</h2>
      <span style="font-size: 13px; color: #756C66">32 saved</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
        <a href="{{cookHref}}" style="display: flex; flex-direction: column; gap: 8px; color: #3D3632; text-decoration: none">
          <div style="height: 134px; border-radius: 22px; background: {{r.tint}}; position: relative; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3D3632" stroke-opacity="0.3" stroke-width="1.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
            <span style="position: absolute; left: 10px; bottom: 10px; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.92); font-size: 12px; font-weight: 600">{{r.time}}</span>
            <sc-if value="{{r.fav}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; right: 10px; top: 10px; width: 30px; height: 30px; border-radius: 15px; background: rgba(255,255,255,0.92); color: {{t.heart}}; display: flex; align-items: center; justify-content: center">
                <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"></path></svg>
              </span>
            </sc-if>
          </div>
          <span style="font-size: 15px; font-weight: 600; line-height: 1.25">{{r.title}}</span>
        </a>
      </sc-for>
    </div>
  </div>
  <a href="{{scanHref}}" aria-label="Add recipe" style="position: absolute; right: 22px; bottom: 104px; width: 60px; height: 60px; border-radius: 30px; background: {{t.accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px {{t.glow}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </a>
  <nav aria-label="Main" style="height: 84px; flex: none; box-sizing: border-box; padding: 10px 24px 24px; background: #FFFFFF; border-radius: 24px 24px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: {{t.accentInk}}; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"></path></svg>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #756C66; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17l-7-4-7 4z"></path></svg>Collections</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #756C66; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-2 9H8z"></path><path d="M6 6L5 3H2"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle></svg>Shopping</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sage","blush"],"default":"sage"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.palette ?? 'sage';
    const sage = { bg: '#FAF6F2', soft: '#DDE6DA', accent: '#5E7A64', accentInk: '#4A6350', heart: '#C98B7E', glow: 'rgba(94,122,100,0.30)', tints: ['#EFE6D8', '#DDE6DA', '#F1DCD5', '#E4E0EC', '#F3EAD3', '#EFE6D8'] };
    const blush = { bg: '#FCF6F5', soft: '#F6DEE1', accent: '#A85A66', accentInk: '#954C58', heart: '#C46A78', glow: 'rgba(168,90,102,0.30)', tints: ['#F6DEE1', '#DDE6DA', '#F1DCD5', '#E4E0EC', '#F9E6E8', '#EFE6D8'] };
    const t = p === 'blush' ? blush : sage;
    const base = [
      { title: 'Mushroom risotto', time: '40 min', fav: false },
      { title: 'Berry pavlova', time: '2 h', fav: true },
      { title: 'Lemon chicken traybake', time: '50 min', fav: false },
      { title: 'Thai green curry', time: '35 min', fav: true },
      { title: "Gran's banana bread", time: '1 h 10', fav: false },
      { title: 'Miso salmon bowls', time: '25 min', fav: false }
    ];
    return {
      t,
      cookHref: p === 'blush' ? 'E_Cook.dc.html' : 'D_Cook.dc.html',
      scanHref: p === 'blush' ? 'E_Scan.dc.html' : 'D_Import.dc.html',
      recipes: base.map((r, i) => ({ ...r, tint: t.tints[i] }))
    };
  }
}
</script>
</body>
</html>
