<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooking log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,100&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F2; color: #3D3632; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: none; padding: 56px 22px 0; display: flex; flex-direction: column; gap: 14px">
    <a href="D_Library.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #3D3632">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; font-weight: 600; color: #4A6350">Gran's banana bread</span>
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 32px; line-height: 1.1">Made 3 times</h1>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; padding: 12px; border-radius: 22px; background: #FFFFFF">
        <div style="width: 70px; height: 70px; flex: none; border-radius: 16px; background: {{e.tint}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D3632" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 13px; font-weight: 700">{{e.date}}</span>
            <span role="img" aria-label="{{e.stars}} out of 5 stars" style="font-size: 13px; letter-spacing: 1px; color: #C98B7E">{{e.starText}}</span>
          </div>
          <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5E5550">{{e.note}}</p>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="flex: none; background: #FFFFFF; border-radius: 26px 26px 0 0; box-shadow: 0 -4px 20px rgba(61,54,50,0.06); padding: 18px 22px 32px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 22px">I made this today</h2>
      <div role="radiogroup" aria-label="Rating" style="display: flex; gap: 2px">
        <sc-for list="{{rate}}" as="r" hint-placeholder-count="5">
          <button role="radio" aria-checked="{{r.on}}" aria-label="{{r.n}} stars" onClick="{{r.pick}}" style="width: 32px; height: 36px; border: none; background: transparent; color: {{r.color}}; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.4 6.7 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>
    <label for="note" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Note</label>
    <textarea id="note" rows="2" placeholder="How did it go? Anything to change next time?" style="resize: none; box-sizing: border-box; padding: 12px 16px; border: none; border-radius: 18px; background: #F5EFE9; font: inherit; font-size: 15px; line-height: 1.4; color: #3D3632"></textarea>
    <div style="display: flex; gap: 10px">
      <button style="flex: none; height: 52px; padding: 0 18px; border-radius: 26px; border: none; background: #F1DCD5; color: #3D3632; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Photo</button>
      <button style="flex: 1; height: 52px; border-radius: 26px; border: none; background: #5E7A64; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; box-shadow: 0 8px 20px rgba(94,122,100,0.25)">Save to log</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rating: 4 };
  }
  renderVals() {
    const stars = (n) => '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
    const entries = [
      { date: '12 Oct 2026', stars: 5, note: 'Added walnuts and a pinch of cinnamon. Best one yet.', tint: '#EFE6D8' },
      { date: '21 Sep 2026', stars: 4, note: 'Bit dry — take it out 5 minutes earlier.', tint: '#F1DCD5' },
      { date: '30 Aug 2026', stars: 3, note: 'Bananas not ripe enough. Wait for black spots!', tint: '#F7EEDB' }
    ].map((e) => ({ ...e, starText: stars(e.stars) }));
    const rate = [1, 2, 3, 4, 5].map((n) => ({
      n, on: n === this.state.rating,
      color: n <= this.state.rating ? '#C98B7E' : '#E2D9D2',
      pick: () => this.setState({ rating: n })
    }));
    return { entries, rate };
  }
}
</script>
</body>
</html>
